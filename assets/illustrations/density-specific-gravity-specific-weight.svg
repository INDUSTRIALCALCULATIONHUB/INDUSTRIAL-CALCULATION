  </g>
  <g fill="#164b73" font-family="Georgia,serif" text-anchor="middle"><text x="285" y="285" font-size="34">same volume</text><text x="885" y="285" font-size="34">same volume</text><text x="600" y="105" font-size="42">ρ = m / V</text><text x="600" y="610" font-size="36">SG = ρ / ρref    •    γ = ρg</text></g>
  <g fill="#176675" font-family="Arial,sans-serif" font-size="25" font-weight="700"><text x="205" y="385">fluid A</text><text x="790" y="480">fluid B</text></g>
</svg>
