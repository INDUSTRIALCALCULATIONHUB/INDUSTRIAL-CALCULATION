  <rect width="1200" height="700" fill="#fffdf8"/><rect width="1200" height="700" fill="url(#grid)"/>
  <g fill="none" stroke="#164b73" stroke-linecap="round" stroke-linejoin="round">
    <path d="M105 540h400M690 540h400" stroke-width="5"/>
    <path d="M170 510V205h230v305M160 205h250M185 330h200M185 425h200" stroke-width="5"/>
    <path d="M755 510V205h230v305M745 205h250M770 330h200M770 425h200" stroke-width="5"/>
    <path d="M185 330h200v180H185z" fill="#d9eef3" stroke-width="3"/><path d="M770 425h200v85H770z" fill="#e9dbc7" stroke-width="3"/>
