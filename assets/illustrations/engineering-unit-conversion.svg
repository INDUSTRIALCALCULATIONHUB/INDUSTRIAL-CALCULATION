<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title description">
  <title id="title">Engineering unit conversion principle diagram</title>
  <desc id="description">An original technical illustration showing a known input quantity, a verified conversion factor and an equivalent engineering result in a different unit.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#c9e5ed" stroke-width="1"/></pattern>
    <linearGradient id="panel" x1="0" x2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#edf8fa"/></linearGradient>
  </defs>
  <rect width="920" height="520" fill="#fff"/>
  <rect x="18" y="18" width="884" height="484" rx="18" fill="url(#grid)" opacity=".86"/>
  <path d="M76 113H844M76 407H844" stroke="#d4e9ef" stroke-width="2"/>
  <g fill="url(#panel)" stroke="#1d5b81" stroke-width="4">
    <rect x="68" y="166" width="220" height="180" rx="15"/>
    <rect x="632" y="166" width="220" height="180" rx="15"/>
  </g>
  <g fill="#164b73" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="178" y="209" font-size="20" font-weight="700">KNOWN QUANTITY</text>
    <text x="178" y="265" font-size="48" font-weight="700">12.0 m</text>
    <text x="178" y="303" font-size="18">design drawing dimension</text>
    <text x="742" y="209" font-size="20" font-weight="700">EQUIVALENT VALUE</text>
    <text x="742" y="265" font-size="48" font-weight="700">39.37 ft</text>
    <text x="742" y="303" font-size="18">same physical length</text>
  </g>
  <g fill="#fffaf1" stroke="#b9681e" stroke-width="4">
    <rect x="352" y="192" width="216" height="128" rx="15"/>
  </g>
  <g fill="#a95716" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="460" y="227" font-size="16" font-weight="700">VERIFIED CONVERSION</text>
    <text x="460" y="266" font-size="25" font-weight="700">× 3.28084</text>
    <text x="460" y="294" font-size="15">keep quantity and units consistent</text>
  </g>
  <path d="M300 256H338M580 256H620" fill="none" stroke="#176675" stroke-width="6" stroke-linecap="round"/>
  <path d="M329 240l20 16-20 16M591 240l20 16-20 16" fill="none" stroke="#176675" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#176675" font-family="Arial, sans-serif">
    <text x="85" y="89" font-size="19" font-weight="700">ENGINEERING UNIT CONVERSION</text>
    <text x="85" y="439" font-size="17">1. Identify the physical quantity</text>
    <text x="85" y="466" font-size="17">2. Use an exact or approved conversion factor</text>
    <text x="525" y="439" font-size="17">3. Check units, conditions and result reasonableness</text>
  </g>
  <g fill="none" stroke="#b9681e" stroke-width="3"><circle cx="65" cy="83" r="9"/><circle cx="65" cy="433" r="7"/><circle cx="505" cy="433" r="7"/></g>
</svg>
