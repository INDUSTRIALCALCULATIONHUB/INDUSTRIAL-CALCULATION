<rect width="1200" height="650" fill="#fffdf8"/><rect width="1200" height="650" fill="url(#grid)"/>
<g stroke="#164b73" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M90 160H650M90 450H650" stroke-width="12"/><rect x="115" y="172" width="510" height="266" rx="6" fill="#d9eef3" stroke-width="3"/><path d="M155 400H545M155 345H500M155 290H450M155 235H400" stroke="#248292" stroke-width="4"/><path d="M400 220l22 15-22 15M450 275l22 15-22 15M500 330l22 15-22 15M545 385l22 15-22 15" stroke="#bf7b2e" stroke-width="4"/><path d="M710 145V480H1110V145Z" stroke="#c9dfe6" stroke-width="3"/><path d="M770 270H1040M905 190V390" stroke-width="4"/><path d="M780 250l-10 20 10 20M1030 250l10 20-10 20" stroke="#bf7b2e" stroke-width="4"/></g>
<g fill="#164b73" font-family="Georgia,serif" text-anchor="middle"><text x="370" y="90" font-size="38">Shear between fluid layers</text><text x="910" y="90" font-size="38">Viscosity relationships</text></g>
<g fill="#456878" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><text x="370" y="520">higher velocity near moving plate</text><text x="910" y="220">τ = μ (du/dy)</text><text x="910" y="315">ν = μ / ρ</text><text x="910" y="410">Re = vD / ν</text><text x="600" y="595">Use viscosity and density at the same declared fluid condition.</text></g>
