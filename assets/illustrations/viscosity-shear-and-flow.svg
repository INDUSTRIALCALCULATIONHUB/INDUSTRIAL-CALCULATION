<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Dynamic and kinematic viscosity diagram</title><desc id="desc">A technical diagram showing fluid layers shearing between two plates and the relationships for dynamic and kinematic viscosity.</desc>
