<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Centrifugal pump and system curve diagram</title><desc id="desc">A technical diagram showing a centrifugal pump, a rising system and the intersection of pump and system curves.</desc>
<defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#dce8ea"/></pattern></defs>
<rect width="1200" height="650" fill="#fffdf8"/><rect width="1200" height="650" fill="url(#grid)"/>
<g stroke="#164b73" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="255" cy="340" r="105" fill="#d9eef3" stroke-width="6"/><circle cx="255" cy="340" r="35" stroke-width="6"/><path d="M150 340H90M360 340H460V200H550" stroke-width="28"/><path d="M460 200H550" stroke="#d9eef3" stroke-width="15"/><path d="M635 500V125H1115M680 450C805 395 875 305 1035 160" stroke-width="5"/><path d="M680 170C800 235 900 345 1040 470" stroke="#248292" stroke-width="6"/><circle cx="870" cy="320" r="12" fill="#bf7b2e" stroke="none"/><path d="M870 320V500M635 320H870" stroke="#bf7b2e" stroke-width="3" stroke-dasharray="7 7"/></g>
<g fill="#164b73" font-family="Georgia,serif" text-anchor="middle"><text x="255" y="150" font-size="36">Centrifugal pump</text><text x="875" y="80" font-size="36">Operating point</text></g>
<g fill="#456878" font-family="Arial,sans-serif" font-size="21" text-anchor="middle"><text x="875" y="555">flow Q →</text><text x="595" y="315" transform="rotate(-90 595 315)">head H →</text><text x="965" y="190">pump curve</text><text x="975" y="460">system curve</text><text x="870" y="295">duty point</text><text x="600" y="610">Select from verified pump curves and the complete system resistance.</text></g>
